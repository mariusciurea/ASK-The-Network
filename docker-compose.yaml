# Local stack: database, backend and frontend.
#
#   docker compose up --build
#   docker compose run --rm backend python -m backend.scripts.initialize_db
#
# The build context is the repository root for both images, which is also how
# Railway builds them.

services:
  db:
    image: mysql:8
    container_name: ask-network-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Changeme_123}
      MYSQL_DATABASE: radio_network_data
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-Changeme_123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ask-network-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8082
      DB_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-Changeme_123}@db:3306/radio_network_data
      SESSION_SERVICE_URI: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-Changeme_123}@db:3306/radio_network_data
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-not-for-production}
      ENVIRONMENT: local
      ALLOWED_ORIGINS: http://localhost:8501
    ports:
      - "8082:8082"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ask-network-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 8501
      BASE_URL: http://backend:8082
    ports:
      - "8501:8501"

volumes:
  mysql_data:
