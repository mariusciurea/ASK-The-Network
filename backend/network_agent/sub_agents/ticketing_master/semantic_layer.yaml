# =============================================================================
# Semantic layer for the ticketing_master agent.
#
# Single source of truth for everything the agent is allowed to know (and
# assume) about the ticket database. It feeds four consumers:
#
#   1. prompt.py     -> renders the SMALL, static core section of the
#                       instruction (concept map + hard rules + column list)
#   2. data_tools.py -> describe_schema() serves the verbose parts on demand,
#                       run_metric() builds parameterized metric queries
#   3. sql_guard.py  -> validates the SQL generated by the model
#   4. eval/         -> the expectations the regression suite checks
#
# Token budget: anything under `detail: on_demand` is NOT sent with every
# prompt; the model pulls it with describe_schema(topic) when it needs it.
#
# Keep this file versioned in git: every change here is a behaviour change of
# the agent and should be re-checked against the eval set.
# =============================================================================

version: 1

dataset:
  table: ticket_data
  dialect: mysql
  description: >-
    Operational ticket log of a mobile network operator. One row per ticket
    (incident, change, event, build or problem record).
  coverage_start: "2026-01-01"
  coverage_end: "2026-06-30"
  timestamp_format: "%m/%d/%Y %H:%i"
  # Anchor for every relative time range ("last 30 days", "recently", ...).
  # The dataset is historical, so NOW() would silently return zero rows.
  reference_date_sql: "(SELECT MAX(STR_TO_DATE(start, '%m/%d/%Y %H:%i')) FROM ticket_data)"

# -----------------------------------------------------------------------------
# Columns
#
# match:
#   internal   - never exposed in filters or output
#   exact      - filter with '=' or IN only, never LIKE
#   pattern    - LIKE with the documented prefix pattern is allowed
#   enum       - '=' or IN, restricted to the documented values
#   numeric    - comparison operators
#   timestamp  - string column, always wrapped in STR_TO_DATE()
#   free_text  - human prose, only searched when the user explicitly asks
#
# lookup: exposed through the lookup_column_values tool
# hint:   the one line that goes into the always-on instruction
# -----------------------------------------------------------------------------
columns:

  id:
    type: integer
    description: Internal surrogate key, not meaningful to users.
    match: internal

  ticket_number:
    type: string
    hint: unique ticket id; the Z_<TYPE> prefix carries the ticket type
    description: >-
      Unique ticket identifier. The prefix encodes the ticket type,
      e.g. Z_INM200900A001 is an incident.
    synonyms: [ticket, ticket id, ticket number, INM, SRM, NEV, NBL, PRM]
    match: pattern
    pattern: "Z_<TYPE>%"
    examples: ["Z_INM200900A001", "Z_SRM200431A001"]

  status:
    type: string
    hint: lifecycle state (6 values, see status_group)
    description: Current lifecycle state of the ticket.
    synonyms: [state, ticket status]
    match: enum
    values: [Open, In Progress, Assigned, Noticed, Closed, Answered]

  creator_area:
    type: string
    hint: team that raised the ticket
    description: Organisational unit that raised the ticket.
    synonyms: [creator, raised by, reporting team]
    match: enum
    values:
      - G-RAN-FO-VFRO-ZV
      - G-RAN-BO-VFRO-ZV
      - G-RAN-FO-VFRO-NW
      - G-RAN-FO-VFRO-SO
      - G-IP-OPS
      - G-CORE-OPS
      - G-TX-OPS

  use_case:
    type: string
    hint: business category, aligned with the ticket type
    description: Business category of the ticket, aligned with the ticket type prefix.
    synonyms: [category, ticket category, process]
    match: enum
    values: [Network-Incident, Change-Request, Network-Event, Network-Build, Problem-Management]

  subject:
    type: string
    hint: normalised alarm / problem name - THE column for "what kind of problem"
    description: >-
      Short, normalised title of the issue or activity. This is the structured
      "alarm name" / "problem type" of a ticket.
    synonyms: [alarm, alarm name, problem, problem type, issue, issue type, title]
    match: exact
    allow_like: true
    lookup: true
    cardinality: 51
    examples: ["Link Down", "Fiber Cut Detected", "Störung - RBS - Huawei 4G", "VSWR Alarm"]
    notes: >-
      51 distinct values. Resolve the user's wording with lookup_column_values
      before filtering; fall back to LIKE only when the lookup returns nothing.

  priority:
    type: integer
    hint: 1 = critical ... 5 = low
    description: Ticket priority, 1 = critical, 5 = low.
    synonyms: [severity, urgency, prio]
    match: numeric
    values: [1, 2, 3, 4, 5]

  description:
    type: text
    hint: FREE TEXT - never filter it for location, element, alarm or status
    description: >-
      Free-text alarm/activity text written by the monitoring system or the
      engineer. It repeats the network element id and the subject in prose,
      which makes it a trap for filtering.
    synonyms: [text, details, alarm text]
    match: free_text

  start:
    type: string
    hint: ticket start timestamp, string - wrap in STR_TO_DATE()
    description: Timestamp when the ticket/incident started.
    synonyms: [date, created, opened, raised at, start time]
    match: timestamp

  sla_ticket:
    type: string
    hint: SLA deadline, string - wrap in STR_TO_DATE()
    description: >-
      SLA deadline of the ticket, derived from priority
      (P1 = 4h, P2 = 8h, P3 = 24h, P4 = 48h, P5 = 72h after start).
    synonyms: [sla, sla deadline, due date]
    match: timestamp

  network_element_identifier:
    type: string
    hint: node / hardware id - THE column for "which element", never description
    description: Identifier of the affected network element / node (150 distinct values).
    synonyms: [network element, ne, node, site equipment, hardware, element id]
    match: exact
    lookup: true
    examples: ["OXVOWF7", "OXV9XUY"]

  loc_identifier:
    type: string
    hint: site / location code - THE only geographic column, never description
    description: >-
      Site / location code of the ticket (80 distinct values). This is the only
      geographic column in the dataset.
    synonyms: [location, site, region, area, geography, where]
    match: exact
    lookup: true
    examples: ["DZR1Y", "OCWBF"]

  assignee_area:
    type: string
    hint: team that owns the resolution
    description: Team that owns the resolution of the ticket.
    synonyms: [assignee, owner, responsible team, assigned to]
    match: enum
    values:
      - G-RAN-FO-VFRO-ZV
      - G-RAN-BO-VFRO-ZV
      - G-RAN-FO-VFRO-NW
      - G-IP-OPS
      - G-CORE-OPS
      - G-TX-OPS

  response_subject:
    type: string
    hint: resolution category; '' (empty string) while unresolved, never NULL
    description: >-
      Normalised resolution category. Empty string (not NULL) while the ticket
      is unresolved, so always filter with <> '' and never with IS NOT NULL.
    synonyms: [resolution, resolution category, outcome, how it was fixed]
    match: enum
    values:
      - Behoben
      - Root cause fixed
      - Issue resolved
      - No impact confirmed
      - Monitoring ongoing
      - Workaround applied
      - Escalated to vendor
      - Kein Fehler - Ticket zurückgezogen

  response_description:
    type: text
    hint: FREE TEXT - what the engineer actually did
    description: Free-text description of what the engineer actually did.
    synonyms: [resolution text, fix details, work log]
    match: free_text

# -----------------------------------------------------------------------------
# Value groups - named sets used by rules, metrics and the guard
# -----------------------------------------------------------------------------
groups:

  status_group:
    column: status
    description: Coarse lifecycle buckets.
    members:
      active: [Open, In Progress, Assigned, Noticed]
      resolved: [Closed, Answered]

  resolution_group:
    column: response_subject
    description: Which resolution categories count as a real fix.
    members:
      fixed: [Behoben, Root cause fixed, Issue resolved]
      no_fault: [No impact confirmed, Kein Fehler - Ticket zurückgezogen]
      pending: [Monitoring ongoing, Workaround applied, Escalated to vendor]

  ticket_type:
    column: ticket_number
    description: >-
      Ticket type, encoded in the ticket_number prefix Z_<TYPE>. Filter with
      ticket_number LIKE 'Z_INM%' or with the matching use_case value.
    members:
      INM: ["Z_INM%"]
      SRM: ["Z_SRM%"]
      NEV: ["Z_NEV%"]
      NBL: ["Z_NBL%"]
      PRM: ["Z_PRM%"]
    labels:
      INM: Incident (Network-Incident)
      SRM: Change request (Change-Request)
      NEV: Network event (Network-Event)
      NBL: Network build (Network-Build)
      PRM: Problem record (Problem-Management)

# -----------------------------------------------------------------------------
# Concept map - user vocabulary to columns. Anything not listed here is
# ambiguous and must be clarified with the user, never guessed.
# -----------------------------------------------------------------------------
concepts:
  region / location / site / area: loc_identifier
  network element / node / hardware: network_element_identifier
  alarm / problem / issue type: subject
  resolution / outcome / how it was fixed: response_subject
  team / owner: assignee_area
  reporter: creator_area
  ticket type (incident, change, ...): ticket_number prefix or use_case
  severity / urgency: priority
  when / period: start

# -----------------------------------------------------------------------------
# Hard rules. These go verbatim into the agent instruction; the ones with
# `enforced_by` are additionally checked in code before the query runs.
# -----------------------------------------------------------------------------
rules:

  - id: geo_filters_use_loc_identifier
    text: >-
      Any geographic filter (region, location, site, area) uses loc_identifier
      with '=' or IN. Never search a location in description or
      response_description: the same token appears there in tickets that belong
      to other sites.
    enforced_by: sql_guard.misplaced_literal

  - id: element_filters_use_identifier_column
    text: >-
      Any filter on a network element / node uses network_element_identifier
      with '='. The element id is repeated inside description, so filtering the
      text returns unrelated tickets.
    enforced_by: sql_guard.misplaced_literal

  - id: free_text_only_on_request
    text: >-
      description and response_description are free text. Filter them only when
      the user explicitly asks to search the ticket text, and only for wording
      that has no structured column (for example "fiber splice").
    enforced_by: sql_guard.misplaced_literal

  - id: resolve_values_before_filtering
    text: >-
      Before filtering subject, loc_identifier or network_element_identifier on
      a term taken from the user's wording, call lookup_column_values to get the
      canonical value. If nothing matches, say so instead of inventing a filter.

  - id: prefer_metrics_over_free_sql
    text: >-
      If a metric in the catalogue answers the question, call run_metric. Free
      SQL via send_sql_command is the fallback for ad-hoc questions only, so
      that the same question keeps giving the same answer.

  - id: unresolved_is_empty_string
    text: >-
      Unresolved tickets carry response_subject = '' (empty string), not NULL.
      Use response_subject <> '' to select resolved tickets.

  - id: relative_dates_anchor_on_dataset
    text: >-
      The dataset is historical (2026-01-01 to 2026-06-30). Never anchor a
      relative range on NOW(); anchor it on the latest ticket in the data and
      state that anchor date in the report.

  - id: only_ticket_data_table
    text: >-
      Query only the ticket_data table. Radio inventory questions belong to the
      radio_agent - hand them back to the root agent instead of joining.
    enforced_by: sql_guard.allowed_tables

  - id: read_only_and_bounded
    text: >-
      Generate SELECT statements only, one statement per call, always with a
      LIMIT. Anything else is rejected before it reaches the database.
    enforced_by: sql_guard.read_only

  - id: never_invent_columns
    text: >-
      Use only the listed columns. Columns such as end, solution_date, region,
      city or resolution_time do not exist in this dataset.
    enforced_by: sql_guard.known_columns

  - id: report_the_filter
    text: >-
      Every answer states the filters that were actually applied (column and
      value) and the number of matching tickets, so the user can verify how the
      question was interpreted.

# -----------------------------------------------------------------------------
# Filters usable by run_metric. The runner binds every value as a SQL
# parameter, so the model never writes SQL for a metric.
# -----------------------------------------------------------------------------
filters:

  loc_identifier:
    kind: equals
    column: loc_identifier
    description: Site / location code, e.g. DZR1Y.

  network_element_identifier:
    kind: equals
    column: network_element_identifier
    description: Network element id, e.g. OXVOWF7.

  subject:
    kind: equals
    column: subject
    description: Exact subject / alarm name, e.g. "Link Down".

  assignee_area:
    kind: equals
    column: assignee_area
    description: Owning team.

  use_case:
    kind: equals
    column: use_case
    description: Business category of the ticket.

  priority:
    kind: equals
    column: priority
    description: Priority 1-5.

  status:
    kind: equals
    column: status
    description: A single exact status value.

  status_group:
    kind: group
    group: status_group
    description: "active or resolved"

  ticket_type:
    kind: prefix
    group: ticket_type
    column: ticket_number
    description: "INM, SRM, NEV, NBL or PRM"

  date_from:
    kind: date_from
    column: start
    description: Inclusive lower bound of the ticket start, format YYYY-MM-DD.

  date_to:
    kind: date_to
    column: start
    description: Exclusive upper bound of the ticket start, format YYYY-MM-DD.

# -----------------------------------------------------------------------------
# Metric catalogue - deterministic answers for the recurring questions.
# Each statement must contain the {filters} placeholder after `WHERE 1=1`.
# Only `name` and `description` are ever sent to the model; the SQL stays here.
# -----------------------------------------------------------------------------
metrics:

  top_resolutions:
    description: >-
      Most frequent resolution categories with a sample of the resolution text.
      Answers "how is this usually fixed / most common resolution".
    default_limit: 10
    sql: |
      SELECT response_subject AS resolution,
             COUNT(*) AS ticket_count,
             MIN(response_description) AS example_resolution_text
      FROM ticket_data
      WHERE 1=1
        AND response_subject <> ''
        {filters}
      GROUP BY response_subject
      ORDER BY ticket_count DESC

  ticket_volume_by_subject:
    description: >-
      Ticket count per subject (alarm / problem type). Answers "which issues
      were most frequent" and "how many tickets for this problem".
    default_limit: 15
    sql: |
      SELECT subject,
             COUNT(*) AS ticket_count,
             MIN(STR_TO_DATE(start, '%m/%d/%Y %H:%i')) AS first_occurrence,
             MAX(STR_TO_DATE(start, '%m/%d/%Y %H:%i')) AS last_occurrence
      FROM ticket_data
      WHERE 1=1
        {filters}
      GROUP BY subject
      ORDER BY ticket_count DESC

  ticket_volume_by_location:
    description: Ticket count per site / location code. Answers "which regions are affected".
    default_limit: 15
    sql: |
      SELECT loc_identifier AS location,
             COUNT(*) AS ticket_count,
             SUM(CASE WHEN status IN ('Open', 'In Progress', 'Assigned', 'Noticed')
                      THEN 1 ELSE 0 END) AS active_count
      FROM ticket_data
      WHERE 1=1
        {filters}
      GROUP BY loc_identifier
      ORDER BY ticket_count DESC

  ticket_distribution_by_priority:
    description: Ticket count per priority level. Answers "distribution by priority / severity".
    default_limit: 5
    sql: |
      SELECT priority,
             COUNT(*) AS ticket_count,
             SUM(CASE WHEN status IN ('Closed', 'Answered') THEN 1 ELSE 0 END) AS resolved_count
      FROM ticket_data
      WHERE 1=1
        {filters}
      GROUP BY priority
      ORDER BY priority

  recurrence_by_element:
    description: >-
      Network elements with repeated tickets for the same subject. Answers
      "recurrence rate for this alarm on this hardware / site".
    default_limit: 20
    sql: |
      SELECT network_element_identifier,
             subject,
             COUNT(*) AS occurrences,
             SUM(CASE WHEN status IN ('Closed', 'Answered') THEN 1 ELSE 0 END) AS resolved_count,
             MIN(STR_TO_DATE(start, '%m/%d/%Y %H:%i')) AS first_occurrence,
             MAX(STR_TO_DATE(start, '%m/%d/%Y %H:%i')) AS last_occurrence
      FROM ticket_data
      WHERE 1=1
        {filters}
      GROUP BY network_element_identifier, subject
      HAVING occurrences > 1
      ORDER BY occurrences DESC

  sla_at_risk:
    description: >-
      Active tickets ordered by SLA deadline, with the hours left relative to
      the dataset reference date. Answers "which SLAs are about to expire".
    default_limit: 20
    sql: |
      SELECT ticket_number,
             subject,
             priority,
             status,
             loc_identifier AS location,
             network_element_identifier,
             STR_TO_DATE(sla_ticket, '%m/%d/%Y %H:%i') AS sla_deadline,
             TIMESTAMPDIFF(
                 HOUR,
                 (SELECT MAX(STR_TO_DATE(start, '%m/%d/%Y %H:%i')) FROM ticket_data),
                 STR_TO_DATE(sla_ticket, '%m/%d/%Y %H:%i')
             ) AS hours_to_deadline
      FROM ticket_data
      WHERE 1=1
        AND status IN ('Open', 'In Progress', 'Assigned', 'Noticed')
        AND sla_ticket <> ''
        {filters}
      ORDER BY sla_deadline ASC

  active_clusters:
    description: >-
      Active tickets grouped by subject and location - several open tickets for
      the same problem in the same place. Answers "do we have multiple tickets
      for the same problem right now".
    default_limit: 20
    sql: |
      SELECT subject,
             loc_identifier AS location,
             COUNT(*) AS active_count,
             GROUP_CONCAT(ticket_number ORDER BY ticket_number SEPARATOR ', ') AS ticket_numbers
      FROM ticket_data
      WHERE 1=1
        AND status IN ('Open', 'In Progress', 'Assigned', 'Noticed')
        {filters}
      GROUP BY subject, loc_identifier
      HAVING active_count > 1
      ORDER BY active_count DESC

  changes_on_element:
    description: >-
      Change-type tickets (SRM, NEV, NBL) on a network element, newest first.
      Answers "what changes were made on this node / site".
    default_limit: 20
    sql: |
      SELECT ticket_number,
             use_case,
             subject,
             status,
             network_element_identifier,
             loc_identifier AS location,
             STR_TO_DATE(start, '%m/%d/%Y %H:%i') AS started_at
      FROM ticket_data
      WHERE 1=1
        AND use_case IN ('Change-Request', 'Network-Event', 'Network-Build')
        {filters}
      ORDER BY started_at DESC

  incidents_after_changes:
    description: >-
      Incidents that started within 7 days after a change on the same network
      element. Answers "can these incidents be correlated with recent changes".
      Correlation by element and time window only - not proof of causality.
    default_limit: 20
    filter_alias: inm
    sql: |
      SELECT inm.ticket_number AS incident_ticket,
             inm.subject AS incident_subject,
             inm.network_element_identifier,
             STR_TO_DATE(inm.start, '%m/%d/%Y %H:%i') AS incident_start,
             chg.ticket_number AS change_ticket,
             chg.subject AS change_subject,
             STR_TO_DATE(chg.start, '%m/%d/%Y %H:%i') AS change_start
      FROM ticket_data AS inm
      JOIN ticket_data AS chg
        ON inm.network_element_identifier = chg.network_element_identifier
       AND chg.use_case IN ('Change-Request', 'Network-Event', 'Network-Build')
       AND STR_TO_DATE(inm.start, '%m/%d/%Y %H:%i')
             BETWEEN STR_TO_DATE(chg.start, '%m/%d/%Y %H:%i')
                 AND STR_TO_DATE(chg.start, '%m/%d/%Y %H:%i') + INTERVAL 7 DAY
      WHERE 1=1
        AND inm.use_case = 'Network-Incident'
        {filters}
      ORDER BY incident_start DESC

# -----------------------------------------------------------------------------
# Few-shot examples, served on demand by describe_schema("examples").
# `avoid` documents the wrong query the model is tempted to write, and why.
# -----------------------------------------------------------------------------
examples:

  - question: What is the most common resolution for tickets on site DZR1Y?
    call: "run_metric(metric_name='top_resolutions', loc_identifier='DZR1Y')"
    avoid: >-
      WHERE description LIKE '%DZR1Y%' - the site code also appears in the free
      text of tickets that belong to other sites.

  - question: How many Link Down tickets were raised in March 2026?
    sql: |
      SELECT COUNT(*) AS ticket_count
      FROM ticket_data
      WHERE subject = 'Link Down'
        AND STR_TO_DATE(start, '%m/%d/%Y %H:%i') >= '2026-03-01'
        AND STR_TO_DATE(start, '%m/%d/%Y %H:%i') <  '2026-04-01'
      LIMIT 100
    avoid: >-
      description LIKE '%link down%' - the description of unrelated incidents
      contains the same words.

  - question: Show me the open incidents for network element OXVOWF7.
    sql: |
      SELECT ticket_number, subject, priority, status,
             STR_TO_DATE(start, '%m/%d/%Y %H:%i') AS started_at
      FROM ticket_data
      WHERE network_element_identifier = 'OXVOWF7'
        AND ticket_number LIKE 'Z_INM%'
        AND status IN ('Open', 'In Progress', 'Assigned', 'Noticed')
      ORDER BY started_at DESC
      LIMIT 50

  - question: Which tickets mention a fiber splice in the resolution text?
    sql: |
      SELECT ticket_number, subject, response_subject, response_description
      FROM ticket_data
      WHERE response_description LIKE '%fiber splice%'
      LIMIT 50
    note: >-
      Allowed: the user explicitly asked for a text search and "fiber splice"
      is not a value of any structured column.

  - question: What were the most frequent issues in the last 30 days?
    sql: |
      SELECT subject, COUNT(*) AS ticket_count
      FROM ticket_data
      WHERE STR_TO_DATE(start, '%m/%d/%Y %H:%i') >=
            (SELECT MAX(STR_TO_DATE(start, '%m/%d/%Y %H:%i')) FROM ticket_data) - INTERVAL 30 DAY
      GROUP BY subject
      ORDER BY ticket_count DESC
      LIMIT 10
    note: >-
      The range is anchored on the latest ticket in the dataset, and the report
      must state that anchor date.

# -----------------------------------------------------------------------------
# Questions this dataset cannot answer. The agent says so instead of
# approximating with a column that means something else.
# -----------------------------------------------------------------------------
unsupported:

  - concept: MTTR / average resolution time / how long it took to fix
    reason: >-
      ticket_data has no resolution timestamp - only start and the SLA deadline.
      The start-to-SLA window is the contractual target, not the time to repair,
      so it must never be reported as MTTR. Offer SLA statistics instead and
      name them as such.

  - concept: City or country names (Berlin, Munich, ...)
    reason: >-
      Locations are coded (five-character loc_identifier) and there is no
      mapping table, so a city name cannot be resolved. Ask the user for the
      site code or use lookup_column_values.

  - concept: Customer impact, outage minutes, traffic loss
    reason: Not captured in this dataset.
